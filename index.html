<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Momo ✦ Palacio by Lola - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --cream: #FAF6EF;
    --dark: #1A1208; --warm: #2D1F0A; --text: #3D2B0F; --muted: #8A7560;
  }
  body {
    background-color: var(--cream); color: var(--text);
    font-family: 'DM Sans', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2.5rem 1.2rem; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(201,168,76,0.13) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 90% 100%, rgba(201,168,76,0.07) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }
  .container { position: relative; z-index: 1; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 1.4rem; }
  .header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; animation: fadeUp 0.5s ease both; }
  .avatar { width: 82px; height: 82px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--warm)); display: flex; align-items: center; justify-content: center; font-size: 2.1rem; box-shadow: 0 0 0 3px var(--cream), 0 0 0 5px rgba(201,168,76,0.35), 0 10px 28px rgba(201,168,76,0.18); margin-bottom: 0.4rem; }
  .name { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--dark); letter-spacing: -0.02em; line-height: 1; }
  .role { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .divider { display: flex; align-items: center; gap: 0.5rem; color: var(--gold); font-size: 0.65rem; letter-spacing: 0.3em; margin-top: 0.2rem; }
  .divider::before, .divider::after { content: ''; width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .divider::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .btn-carta { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.88rem 1.2rem; border-radius: 14px; background: var(--dark); color: var(--gold-light); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; text-decoration: none; border: 1px solid rgba(201,168,76,0.2); box-shadow: 0 4px 16px rgba(26,18,8,0.2); transition: transform 0.18s, box-shadow 0.18s; animation: fadeUp 0.5s ease both; }
  .btn-carta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,18,8,0.3); }
  .btn-carta:active { transform: translateY(0); }
  .ext { font-size: 0.68rem; opacity: 0.45; margin-left: auto; }
  .options-section { width: 100%; display: flex; flex-direction: column; gap: 0.6rem; animation: fadeUp 0.5s 0.05s ease both; }
  .cs-label { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .cs-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.4rem; }
  .cs-chip { background: transparent; border: 1px solid rgba(201,168,76,0.3); border-radius: 20px; padding: 0.4rem 0.8rem; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 0.75rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.3rem; }
  .cs-chip:hover { border-color: var(--gold); color: var(--text); }
  .cs-chip.active { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--dark); font-weight: 500; box-shadow: 0 2px 8px rgba(201,168,76,0.15); }
  .cs-chip.active-peach { background: rgba(255,182,193,0.2); border-color: #ff8c94; color: var(--dark); font-weight: 500; box-shadow: 0 2px 8px rgba(255,182,193,0.3); }
  .ai-section { width: 100%; display: flex; flex-direction: column; gap: 0.5rem; animation: fadeUp 0.5s 0.08s ease both; }
  .inputs-row { display: flex; gap: 0.4rem; width: 100%; }
  .custom-notes { width: 100%; background: #fff; border: 1px solid rgba(201,168,76,0.25); border-radius: 12px; padding: 0.85rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; transition: all 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
  .custom-notes:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
  .custom-notes::placeholder { color: var(--muted); opacity: 0.6; }
  .btn-ai-generate { width: 100%; padding: 0.8rem; border-radius: 12px; background: linear-gradient(135deg, #fff, var(--cream)); border: 1px solid var(--gold); color: var(--dark); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.4rem; box-shadow: 0 2px 8px rgba(201,168,76,0.1); }
  .btn-ai-generate:hover { background: var(--gold); color: #fff; box-shadow: 0 4px 14px rgba(201,168,76,0.3); }
  .btn-ai-generate:disabled { opacity: 0.6; pointer-events: none; }
  .review-card { width: 100%; background: #fff; border: 1px solid rgba(201,168,76,0.16); border-radius: 20px; padding: 1.3rem; box-shadow: 0 4px 20px rgba(201,168,76,0.06), 0 1px 4px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 0.9rem; animation: fadeUp 0.5s 0.12s ease both; }
  .rc-header { display: flex; align-items: center; justify-content: space-between; }
  .rc-label-wrap { display: flex; flex-direction: column; gap: 0.12rem; }
  .rc-label { font-size: 0.67rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
  .rc-counter { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.05em; }
  .stars { color: var(--gold); font-size: 0.8rem; letter-spacing: 0.04em; }
  .review-body { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; line-height: 1.72; color: var(--text); min-height: 68px; transition: opacity 0.28s ease; }
  .review-body.fading { opacity: 0; }
  .added-phrase { color: var(--gold); font-weight: 500; }
  .rc-footer { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid rgba(201,168,76,0.15); padding-bottom: 1rem; margin-bottom: 0.2rem; }
  .footer-left { display: flex; gap: 0.4rem; align-items: center; }
  .btn-refresh { background: none; border: 1px solid rgba(201,168,76,0.22); border-radius: 8px; color: var(--muted); font-size: 0.74rem; font-family: 'DM Sans', sans-serif; cursor: pointer; padding: 0.4rem 0.6rem; display: flex; align-items: center; gap: 0.28rem; transition: all 0.18s; }
  .btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
  .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }
  .lang-select { background: rgba(255,255,255,0.5); border: 1px solid rgba(201,168,76,0.3); border-radius: 8px; color: var(--muted); font-size: 0.74rem; font-weight: 500; font-family: 'DM Sans', sans-serif; padding: 0.35rem 0.6rem; cursor: pointer; outline: none; transition: all 0.2s; appearance: none; text-align: center; }
  .lang-select:hover, .lang-select:focus { border-color: var(--gold); color: var(--gold); background: #fff; }
  .lang-select:disabled { opacity: 0.4; cursor: not-allowed; }
  .spin { display: inline-block; }
  .loading .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-google-action { width: 100%; background: linear-gradient(135deg, var(--dark), #2a1d0d); border: 1px solid rgba(201,168,76,0.3); border-radius: 12px; color: var(--gold-light); font-size: 0.85rem; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; padding: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s; box-shadow: 0 4px 15px rgba(26,18,8,0.25); text-decoration: none; }
  .btn-google-action:hover { box-shadow: 0 6px 20px rgba(26,18,8,0.35); transform: translateY(-2px); border-color: var(--gold); }
  .btn-google-action:active { transform: scale(0.98); }
  .btn-google-action.copied { background: linear-gradient(135deg, #4CAF82, #2E8B57); color: #fff; border-color: transparent; box-shadow: 0 4px 15px rgba(76,175,130,0.3); animation: copyPop 0.3s ease; }
  @keyframes copyPop { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
  .footer { font-size: 0.67rem; color: var(--muted); text-align: center; opacity: 0.55; letter-spacing: 0.04em; animation: fadeUp 0.5s 0.22s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="container">
  <a href="https://www.palaciobylola.com/carta/" target="_blank" rel="noopener noreferrer" class="btn-carta">
    <span>📖</span> Ver la carta <span class="ext">↗</span>
  </a>
  <div class="options-section">
    <p class="cs-label">🎭 ¿Qué personaje os visitó?</p>
    <div class="cs-chips">
      <button class="cs-chip" id="comp_Princesa" data-group="comp" data-val="Princesa" onclick="toggleOption('comp', 'Princesa')">👑 Princesa Vera</button>
      <button class="cs-chip" id="comp_Drako" data-group="comp" data-val="Drako" onclick="toggleOption('comp', 'Drako')">🐉 Drako</button>
      <button class="cs-chip" id="comp_Principe" data-group="comp" data-val="Principe" onclick="toggleOption('comp', 'Principe')">🤴 P. Martín</button>
      <button class="cs-chip" id="comp_Pirata" data-group="comp" data-val="Pirata" onclick="toggleOption('comp', 'Pirata')">🏴‍☠️ Brutus</button>
    </div>
  </div>
  <div class="options-section">
    <p class="cs-label">🍽️ Recomendaste visitar próximamente:</p>
    <div class="cs-chips">
      <button class="cs-chip" id="rest_LolaNieves" data-group="rest" data-val="LolaNieves" onclick="toggleOption('rest', 'LolaNieves')">🍎 Lola Blanca Nieves</button>
      <button class="cs-chip" id="rest_Story" data-group="rest" data-val="Story" onclick="toggleOption('rest', 'Story')">🏰 Storyland</button>
      <button class="cs-chip" id="rest_Santa" data-group="rest" data-val="Santa" onclick="toggleOption('rest', 'Santa')">🥩 Santa la Vaca</button>
    </div>
  </div>
  <div class="ai-section" style="margin-top: 0.5rem;">
    <div class="inputs-row">
      <input type="text" id="customKeywords" class="custom-notes" placeholder="Destacar... (Ej: risas)" style="flex: 1.6;">
      <input type="text" id="coworkerName" class="custom-notes" placeholder="Compañero/a" style="flex: 1;">
    </div>
    <div class="cs-chips" style="margin-top: 0.1rem; gap: 0.4rem;">
      <button class="cs-chip active" id="btnEmojis" onclick="toggleSetting('btnEmojis')">✨ Emojis</button>
      <button class="cs-chip" id="btnPeach" onclick="togglePeach()">🍑 Momo</button>
    </div>
    <button class="btn-ai-generate" id="btnAIGenerate" onclick="generateNewReview()">
      <span class="spin">✨</span> Crear reseña mágica
    </button>
  </div>
  <div class="review-card">
    <div class="rc-header">
      <div class="rc-label-wrap">
        <span class="rc-label">✍️ Sugerencia de reseña</span>
        <span class="rc-counter" id="statusLabel"><span style="color:var(--gold);">✦</span> Generada por IA</span>
      </div>
      <span class="stars">★★★★★</span>
    </div>
    <p class="review-body" id="reviewBody">
      <span style="opacity:0.5;">✨ Despertando la magia de la IA...</span>
    </p>
    <div class="rc-footer">
      <div class="footer-left">
        <button class="btn-refresh" id="refreshBtn" onclick="generateNewReview()" title="Sugerencia aleatoria">
          <span class="spin">↺</span> Otra opción
        </button>
        <select class="lang-select" id="langSelect" onchange="changeLanguage(this)" title="Cambiar idioma">
          <option value="ES">🇪🇸 ES</option>
          <option value="EN">🇬🇧 EN</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="PT">🇵🇹 PT</option>
          <option value="IT">🇮🇹 IT</option>
        </select>
      </div>
    </div>
    <a href="https://search.google.com/local/writereview?placeid=ChIJKRPlY3goQg0ReZPbVi5zLk8" target="_blank" rel="noopener noreferrer" class="btn-google-action" id="googleActionBtn" onclick="copyAndStyleBtn(this, event)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor" opacity=".9"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="currentColor" opacity=".9"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="currentColor" opacity=".9"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="currentColor" opacity=".9"/>
      </svg>
      Copiar y Publicar en Google
    </a>
  </div>
  <p class="footer">¡Gracias por tu visita! 🤍</p>
</div>
